# Matrix Server Configuration
# Copy this file to config.yaml and fill in your values.

domain: example.com
subdomains:
  matrix: matrix
  element: element
  livekit: livekit
  turn: turn
  admin: admin
  music: music
  tunnel: tunnel

vps:
  host: "1.2.3.4"
  user: root
  # ssh_key: ~/.ssh/id_ed25519  # Optional — omit to use your default SSH key/agent
  # ssh_jump: user@192.168.0.3  # Optional — reach the VPS through a jump host,
  #                             # for networks that will not carry :22 to it
  deploy_dir: /opt/matrix-server

s3:
  media:
    endpoint: https://storage.yandexcloud.net
    bucket: my-media-bucket
    access_key: YOUR_ACCESS_KEY
    secret_key: YOUR_SECRET_KEY
  backup:
    endpoint: https://storage.yandexcloud.net
    bucket: my-backup-bucket
    access_key: YOUR_ACCESS_KEY
    secret_key: YOUR_SECRET_KEY

media_cache:
  max_upload_size_mb: 100
  cleanup_cron: "0 4 * * *"
  min_free_gb: 30

coturn:
  udp_port_range: "49152-49200"

backup:
  cron: "0 3 * * *"
  retention_days: 14

# Telegram bridge (mautrix-telegram)
telegram:
  api_id: "YOUR_API_ID"
  api_hash: "YOUR_API_HASH"
  admin_user: your_matrix_username  # Your Matrix username (not Telegram). Gets bridge admin permissions.
