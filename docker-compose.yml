services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - matrix-net
    depends_on:
      synapse:
        condition: service_started
      element:
        condition: service_started

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - matrix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 10s
      timeout: 5s
      retries: 5

  synapse:
    build:
      context: .
      dockerfile: Dockerfile.synapse
    restart: unless-stopped
    volumes:
      - ./data/synapse:/data
      - ./configs/synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - ./configs/synapse/log.config:/data/log.config:ro
      - ./configs/mautrix-telegram/registration.yaml:/bridges/mautrix-telegram/registration.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - matrix-net

  mautrix-telegram:
    image: dock.mau.dev/mautrix/telegram:latest
    restart: unless-stopped
    entrypoint: ["/usr/bin/mautrix-telegram", "-n", "-c", "/config/config.yaml"]
    volumes:
      - ./data/mautrix-telegram:/data
      - ./configs/mautrix-telegram/config.yaml:/config/config.yaml:ro
      - ./configs/mautrix-telegram/registration.yaml:/config/registration.yaml:ro
    depends_on:
      synapse:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - matrix-net

  element:
    image: vectorim/element-web:latest
    restart: unless-stopped
    volumes:
      - ./configs/element/config.json:/app/config.json:ro
    networks:
      - matrix-net

  synapse-admin:
    image: ghcr.io/etkecc/synapse-admin:latest
    restart: unless-stopped
    environment:
      SYNAPSE_ADMIN_BACKEND: https://${SUBDOMAIN_MATRIX}.${DOMAIN}
    networks:
      - matrix-net

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "50000-50200:50000-50200/udp"
    volumes:
      - ./configs/livekit/livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    networks:
      - matrix-net

  livekit-jwt:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    restart: unless-stopped
    environment:
      LK_JWT_PORT: "8080"
      LIVEKIT_URL: wss://${SUBDOMAIN_LIVEKIT}.${DOMAIN}
      LIVEKIT_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_API_SECRET}
    networks:
      - matrix-net

  chisel:
    # Reverse tunnel for the homeserver's Navidrome. The homeserver dials in
    # over wss://tunnel.<domain> and hands us its port; Caddy serves it at
    # music.<domain>. Design lives in the music repo:
    # docs/superpowers/specs/2026-08-29-navidrome-tunnel-design.md
    image: jpillora/chisel:1.12.0@sha256:e5538d0a8432f53788bf63089d918a4b9979e6df408a2f1aa36575917eacd314
    restart: unless-stopped
    # No `ports:` key, deliberately. The client asks for a listener on
    # 0.0.0.0:4533, which is 0.0.0.0 *inside this container's network
    # namespace* — reachable from matrix-net, and from nowhere else.
    # Publishing it would put Navidrome straight on the public IP with no
    # TLS and no Caddy in front.
    # configs/chisel/users.json.template's one ACL pattern
    # (`^R:0\.0\.0\.0:4533$`) is anchored on purpose: chisel checks it
    # against every remote the client requests, not just reverse ones —
    # against `R:<host>:<port>` for a reverse remote, `<host>:<port>` for a
    # forward one, and the literal `socks` for SOCKS — so the anchor also
    # refuses forward remotes outright, which would otherwise let a stolen
    # credential pivot into matrix-net (Postgres, Synapse, Synapse Admin,
    # LiveKit). See D4 in the music repo's
    # docs/superpowers/specs/2026-08-29-navidrome-tunnel-design.md. (Noted
    # here, not in users.json.template: that file is loaded as strict JSON
    # by chisel — no comments — so a note there would fail the server on
    # the next restart.)
    command: >
      server
      --reverse
      --port 8080
      --authfile /config/users.json
      --keepalive 25s
    # The directory, not the file: the 1.12 images are scratch-based, and a
    # directory mount needs no pre-existing mountpoint in the image.
    volumes:
      - ./configs/chisel:/config:ro
    networks:
      - matrix-net

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./configs/coturn/turnserver.conf:/etc/turnserver.conf:ro
    command: -c /etc/turnserver.conf

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  matrix-net:
    driver: bridge
